server {
  listen 80;
  server_name FSP_PUBLIC_IP;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 308 https://FSP_PUBLIC_IP$request_uri; }
}
server {
  listen 443 ssl;
  server_name FSP_PUBLIC_IP;
  ssl_certificate /etc/letsencrypt/live/fsp-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fsp-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 6m;
  add_header Strict-Transport-Security "max-age=86400" always;
  location / {
    proxy_pass http://fsp-career:8000;
    proxy_set_header Host FSP_PUBLIC_IP;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
}
