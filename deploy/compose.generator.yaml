services:
  generator:
    image: ghcr.io/ggml-org/llama.cpp@sha256:559ac229adefe0f7e2d4e32f5222f26927b6bb8ba44b9db08e2544afebf41984
    profiles: [generation]
    user: "10001:10001"
    command: ["-m", "/models/qwen2.5-0.5b-instruct-q5_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "1024", "--parallel", "1", "--threads", "2", "--threads-batch", "2", "--n-gpu-layers", "0", "--n-predict", "192", "--no-webui", "--no-agent", "--no-slots", "--api-key-file", "/run/secrets/generator-token"]
    volumes:
      - ./deploy/runtime/models:/models:ro
      - ./deploy/runtime/generator-token:/run/secrets/generator-token:ro
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 1024m
    cpus: "1.0"
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: "on-failure:2"
